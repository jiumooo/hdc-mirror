name: 功能建议
description: 提出一个新功能或改进方向
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看 [README](https://github.com/jiumooo/hdc-mirror/blob/main/README.md) 的功能表与
        [`docs/07-架构决策记录.md`](https://github.com/jiumooo/hdc-mirror/blob/main/docs/07-%E6%9E%B6%E6%9E%84%E5%86%B3%E7%AD%96%E8%AE%B0%E5%BD%95.md)，
        有些方向是被有意排除的（例如加入遥测、要求手机端安装 App、要求 root）。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么事情时觉得不方便？越具体越好
      placeholder: "我需要同时看两台手机的画面，目前只能开两个窗口手动对齐"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望它怎么工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在是怎么绕过去的，或别的工具怎么做的

  - type: dropdown
    id: willingness
    attributes:
      label: 是否愿意自己提 PR
      options:
        - 愿意，可以按 CONTRIBUTING.md 的流程来
        - 愿意，但需要一点指导
        - 暂时只能提建议
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 这个建议不依赖在手机上安装任何东西，也不需要 root
          required: true
