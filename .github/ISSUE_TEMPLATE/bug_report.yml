name: 缺陷报告
description: 报告一个可以复现的问题（画面、操作、音频、安装、更新）
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认已经读过 [README 的常见问题](https://github.com/jiumooo/hdc-mirror/blob/main/README.md)，
        扫不到手机、点了没反应、没有声音这几类问题在那里有现成的排查步骤。

        > **隐私提醒**：不要填写真实设备 IP、MAC、SN、手机号、邮箱与个人截图。地址请写 `192.0.2.10` 这类示例值。

  - type: input
    id: version
    attributes:
      label: HdcMirror 版本
      description: 「关于」页可见，或安装包文件名（轻量版 / 内置运行时版）
      placeholder: "0.2.2"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 运行 `winver` 可以查看
      placeholder: "Windows 11 23H2 (22631)"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: 连接方式
      options:
        - 无线局域网
        - USB
        - 两种都试过
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 受影响的模块
      options:
        - 设备发现与连接
        - 画面镜像
        - 操作与输入（点击 / 滑动 / 按键）
        - 音频
        - 安装程序
        - 卸载程序
        - 检查更新
        - 界面与文案
        - 其它
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么，你期望发生什么
      placeholder: |
        期望：连接后画面 30fps 稳定
        实际：连接约 9 分钟后画面冻结，日志出现流结束
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 手机开启无线调试
        2. 打开 HdcMirror，点击「扫描设备」
        3. 选择设备并连接
        4. 约 9 分钟后画面停止更新
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志片段（已脱敏）
      description: 位于 `<安装根>\data\logs`。只贴相关行，贴之前请删掉真实设备地址与设备名
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已读过 README 常见问题，确认不是已知问题
          required: true
        - label: 我贴出的日志与截图已经去掉真实设备地址、设备名与个人信息
          required: true
        - label: 我使用的是最新发布版本，或已确认该问题在新版本上仍存在
          required: true
